name: Testes e APK Android
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes automatizados
        run: npm test
      - name: Validar HTML completo e a lógica embutida
        run: node --check tests/smoke.test.mjs
  compilar-apk:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android do executor
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK de teste
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Validar build Release usando certificado DESCARTAVEL (nao distribuir)
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 18)"
          KEYSTORE="$RUNNER_TEMP/aventura-ci-provisorio.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" -alias aventura -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI Apenas Teste" >/dev/null 2>&1
          AVENTURA_SIGNING_KEYSTORE="$KEYSTORE" AVENTURA_SIGNING_PASSWORD="$PASS" gradle --no-daemon -p android :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk >/dev/null
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: aventura-na-galaxia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
  smoke-android:
    needs: compilar-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aventura-na-galaxia-debug-apk
          path: apk
      - name: Habilitar aceleracao do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r apk/app-debug.apk
            adb shell am start -W -n br.com.aventuranagalaxia/.MainActivity
            sleep 8
            adb logcat -d -v threadtime > galaxia-logcat.txt
            adb shell screencap -p /sdcard/galaxia.png
            adb pull /sdcard/galaxia.png galaxia-emulador.png
            adb shell pidof br.com.aventuranagalaxia
            sh -c "! grep -q 'ANR in br.com.aventuranagalaxia' galaxia-logcat.txt"
            sh -c "! grep -A 6 'FATAL EXCEPTION' galaxia-logcat.txt | grep -q 'Process: br.com.aventuranagalaxia'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-emulador-android
          path: |
            galaxia-emulador.png
            galaxia-logcat.txt
          if-no-files-found: warn
