name: Testes e APK Android
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes automatizados
        run: npm test
      - name: Validar HTML completo e a lógica embutida
        run: node --check tests/smoke.test.mjs
  compilar-apk:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android do executor
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de teste
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: aventura-na-galaxia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
  smoke-android:
    needs: compilar-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aventura-na-galaxia-debug-apk
          path: apk
      - name: Habilitar aceleracao do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r apk/app-debug.apk
            adb shell am start -W -n br.com.aventuranagalaxia/.MainActivity
            sleep 10
            adb shell pidof br.com.aventuranagalaxia
            adb shell screencap -p /sdcard/galaxia.png
            adb pull /sdcard/galaxia.png galaxia-emulador.png
            adb logcat -d -v brief > galaxia-logcat.txt
            if grep -q 'FATAL EXCEPTION' galaxia-logcat.txt; then echo 'Erro fatal no logcat'; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-emulador-android
          path: |
            galaxia-emulador.png
            galaxia-logcat.txt
          if-no-files-found: warn
